[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "verifygate"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==2.1.1"]

[project.scripts]
verifygate-mcp = "verifygate.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verifygate"]
